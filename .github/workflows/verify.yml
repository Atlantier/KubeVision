name: verify

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.8.0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Docs consistency (performance.json / rag-eval.json / verify-summary.json)
        run: node scripts/check-docs-consistency.mjs

      - name: Static verification (tsc + lint + any/GLSL/docs checks; no browser)
        run: node scripts/verify.mjs --quick
