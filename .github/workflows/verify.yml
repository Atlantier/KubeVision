name: verify

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.8.0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Static verification (tsc + lint + dead-exports + any/GLSL checks; no browser)
        run: node scripts/verify.mjs --quick

      - name: Unit & contract test suite
        run: |
          pnpm test:health
          pnpm test:keyboard
          pnpm test:slots
          pnpm test:chat-stream
          pnpm test:demo:fast
          pnpm verify:rag
          pnpm verify:receipt
          pnpm verify:parity
          pnpm verify:telemetry
          pnpm verify:sanitizer

      - name: Production build & style contract gate
        run: |
          pnpm build
          node scripts/check-style-contract.mjs --require-build
